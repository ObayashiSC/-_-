<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんまちPJ 会員属性ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --obayashi-green:#00913A;      /* 大林グリーン */
  --obayashi-green-dark:#00702D;
  --obayashi-green-light:#4FBB7A;
  --obayashi-accent:#8DC63F;     /* ライトグリーンアクセント */
  --ink:#1b2a22;
  --sub:#5c6b63;
  --bg:#f4f7f5;
  --card:#ffffff;
  --line:#e3ebe6;
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  background:var(--bg);color:var(--ink);
}
/* ===== Header ===== */
.header{
  background:linear-gradient(120deg,var(--obayashi-green-dark) 0%,var(--obayashi-green) 55%,var(--obayashi-accent) 130%);
  color:#fff;padding:34px 40px 30px;position:relative;overflow:hidden;
}
.header::after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
  background:rgba(255,255,255,.08);border-radius:50%;
}
.header::before{
  content:"";position:absolute;right:90px;bottom:-90px;width:200px;height:200px;
  background:rgba(255,255,255,.06);border-radius:50%;
}
.header .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.header .logo{
  width:44px;height:44px;border-radius:10px;background:#fff;color:var(--obayashi-green);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.header h1{margin:0;font-size:26px;letter-spacing:.04em;position:relative;z-index:1;}
.header p{margin:8px 0 0;opacity:.92;font-size:14px;position:relative;z-index:1;}
.header .updated{margin:6px 0 0;font-size:12px;opacity:.8;position:relative;z-index:1;}
/* ===== Layout ===== */
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px;}
/* ===== Filter bar ===== */
.filterbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 20px;margin-bottom:22px;box-shadow:0 2px 10px rgba(0,50,20,.05);
}
.filterbar .flabel{font-size:14px;font-weight:700;color:var(--obayashi-green-dark);display:flex;align-items:center;gap:8px;}
.filterbar .flabel .pin{width:10px;height:10px;border-radius:3px;background:var(--obayashi-green);}
.filterbar select{
  appearance:none;-webkit-appearance:none;
  font-size:15px;font-weight:600;color:var(--ink);
  padding:10px 40px 10px 16px;border:2px solid var(--obayashi-green);border-radius:10px;
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2300913A' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center;
  cursor:pointer;min-width:230px;transition:border-color .15s;
}
.filterbar select:hover{border-color:var(--obayashi-green-dark);}
.filterbar .count-badge{
  margin-left:auto;font-size:14px;color:var(--sub);
}
.filterbar .count-badge b{font-size:22px;color:var(--obayashi-green-dark);margin:0 4px;}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px;}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  box-shadow:0 2px 10px rgba(0,50,20,.04);position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;height:100%;width:5px;background:var(--obayashi-green);}
.kpi .label{font-size:13px;color:var(--sub);margin-bottom:6px;}
.kpi .value{font-size:34px;font-weight:800;color:var(--obayashi-green-dark);line-height:1;}
.kpi .unit{font-size:14px;color:var(--sub);margin-left:4px;font-weight:600;}
/* Cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 26px;
  box-shadow:0 2px 12px rgba(0,50,20,.05);
}
.card.col-6{grid-column:span 6;}
.card.col-12{grid-column:span 12;}
.card h2{
  margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;
}
.card h2 .dot{width:11px;height:11px;border-radius:3px;background:var(--obayashi-green);}
.card .sub{font-size:12px;color:var(--sub);margin:0 0 16px;}
.chart-box{position:relative;width:100%;}
.empty-note{
  text-align:center;color:var(--sub);font-size:14px;padding:60px 10px;
  background:#fafcfb;border:1px dashed var(--line);border-radius:12px;
}
.footer{margin-top:34px;text-align:center;font-size:12px;color:var(--sub);}
/* status / error */
.status{
  max-width:1200px;margin:20px auto;padding:18px 22px;border-radius:14px;
  background:#fff8e6;border:1px solid #f0d98a;color:#7a5a10;font-size:14px;line-height:1.7;
}
.status code{background:#fdeecb;padding:2px 6px;border-radius:5px;}
.reload-btn{
  display:inline-block;margin-left:8px;padding:4px 12px;border:none;border-radius:8px;
  background:#fff;color:var(--obayashi-green-dark);font-size:12px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
@media(max-width:820px){
  .card.col-6{grid-column:span 12;}
  .header{padding:26px 22px;}
  .filterbar .count-badge{margin-left:0;width:100%;}
}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="logo">大</div>
    <div>
      <h1>みんまちPJ 会員属性ダッシュボード</h1>
    </div>
  </div>
  <p>LINE公式アカウント登録会員のタグ集計（値が「1」= 該当）｜ プロトタイプ</p>
  <p class="updated" id="updated"></p>
</div>

<div class="wrap">
  <!-- 絞り込みバー -->
  <div class="filterbar" id="filterbar" style="display:none">
    <span class="flabel"><span class="pin"></span>品川とのかかわりで絞り込み</span>
    <select id="segmentSelect"></select>
    <span class="count-badge">対象人数<b id="segCount">0</b>名</span>
  </div>

  <div class="kpi-row" id="kpiRow"></div>
  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
/* ===== 外部JSONファイルのパス（同じフォルダに置く） ===== */
const DATA_FILE = 'dashboard_data.json';
/* キャッシュバスター：URLに現在時刻を付与し、更新後の最新JSONを必ず取得する */
const DATA_URL = DATA_FILE + '?t=' + Date.now();

/* ===== 大林組カラーパレット ===== */
const GREEN       = '#00913A';
const GREEN_DARK  = '#00702D';
const GREEN_LIGHT = '#4FBB7A';
const ACCENT      = '#8DC63F';
const GRID_COLOR  = '#e6ede9';

/* 「全体」を表す特別な選択肢 */
const ALL = '全体';

/* セクションごとのレイアウト（列幅と棒の向き） */
const LAYOUT = {
  gender:    {col:'col-6', horizontal:false},
  age:       {col:'col-6', horizontal:false},
  residence: {col:'col-12',horizontal:true},
  workplace: {col:'col-12',horizontal:true},
  interest:  {col:'col-12',horizontal:true},
};

/* グラデーション生成 */
function makeGradient(ctx, area, c1, c2){
  const g = ctx.createLinearGradient(0,0,area.right,0);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  return g;
}
function makeGradientV(ctx, area, c1, c2){
  const g = ctx.createLinearGradient(0,area.bottom,0,area.top);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  return g;
}

let DATA = null;           /* 読み込んだJSON全体 */
let chartInstances = [];   /* 描画中のChartを保持（再描画時に破棄するため） */

/* ===== JSONを読み込んで初期化（キャッシュ無効化つき） ===== */
fetch(DATA_URL, {cache: 'no-store'})
  .then(res=>{
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  })
  .then(data=>{
    DATA = data;
    initFilter();
    render(ALL);   /* 初期表示は「全体」 */
    const now = new Date();
    document.getElementById('updated').textContent =
      'データ生成：' + (data.meta.generated_at || '-') + ' ／ 最終読み込み：' + now.toLocaleString('ja-JP');
  })
  .catch(err=>{
    document.querySelector('.wrap').innerHTML =
      `<div class="status">
        <strong>⚠ データの読み込みに失敗しました（${err.message}）</strong>
        <button class="reload-btn" onclick="location.reload()">再読み込み</button><br><br>
        以下を確認してください：<br>
        ・<code>${DATA_FILE}</code> が <code>index.html</code> と<strong>同じフォルダ</strong>にあるか<br>
        ・ファイル名が完全一致しているか（大文字小文字も区別されます）<br>
        ・GitHubにJSONファイルをアップロード済みか<br>
        ・数分待ってから、ブラウザで <strong>Ctrl+F5</strong>（強制リロード）を試す
      </div>`;
  });

/* ===== プルダウンを構築 ===== */
function initFilter(){
  const bar = document.getElementById('filterbar');
  const sel = document.getElementById('segmentSelect');
  /* 全体 + 各セグメント */
  const options = [ALL, ...DATA.segments];
  sel.innerHTML = options.map(o=>{
    const n = (o===ALL) ? DATA.members.length
                        : DATA.members.filter(m=>m.segments.includes(o)).length;
    return `<option value="${o}">${o}（${n}名）</option>`;
  }).join('');
  sel.addEventListener('change', e=>render(e.target.value));
  bar.style.display = 'flex';
}

/* ===== 選択セグメントで会員を絞り込む ===== */
function filterMembers(segment){
  if(segment === ALL) return DATA.members;
  return DATA.members.filter(m => m.segments.includes(segment));
}

/* ===== 集計して描画 ===== */
function render(segment){
  /* 既存グラフを破棄 */
  chartInstances.forEach(c=>c.destroy());
  chartInstances = [];

  const members = filterMembers(segment);

  /* 対象人数バッジ */
  document.getElementById('segCount').textContent = members.length;

  /* KPI */
  const kpiData = [
    {label:'対象会員数', value:members.length, unit:'名'},
    {label:'絞り込み', value:segment, unit:''},
  ];
  const male   = members.filter(m=>m.tags.includes('男性')).length;
  const female = members.filter(m=>m.tags.includes('女性')).length;
  kpiData.push({label:'男性 / 女性', value:`${male} / ${female}`, unit:'名'});
  document.getElementById('kpiRow').innerHTML = kpiData.map(k=>`
    <div class="kpi">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}<span class="unit">${k.unit}</span></div>
    </div>`).join('');

  /* グラフ */
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  DATA.sections.forEach(sec=>{
    const cfg = LAYOUT[sec.key] || {col:'col-6',horizontal:true};

    /* このセクションの各ラベルを、絞り込み後の会員でカウント */
    let items = sec.labels.map(lbl=>({
      label: lbl,
      count: members.filter(m=>m.tags.includes(lbl)).length
    }));
    if(cfg.horizontal){ items.sort((a,b)=>b.count-a.count); }

    const labels = items.map(i=>i.label);
    const counts = items.map(i=>i.count);

    const card = document.createElement('div');
    card.className = 'card '+cfg.col;

    /* 対象0名のときはメッセージ表示 */
    if(members.length === 0){
      card.innerHTML = `
        <h2><span class="dot"></span>${sec.title}</h2>
        <p class="sub">該当者数（対象 ${members.length}名）</p>
        <div class="empty-note">この区分に該当する会員がいません</div>`;
      grid.appendChild(card);
      return;
    }

    const height = cfg.horizontal ? Math.max(220, labels.length*30+60) : 300;
    card.innerHTML = `
      <h2><span class="dot"></span>${sec.title}</h2>
      <p class="sub">該当者数（対象 ${members.length}名中）</p>
      <div class="chart-box" style="height:${height}px"><canvas></canvas></div>`;
    grid.appendChild(card);

    const canvas = card.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const chart = new Chart(ctx,{
      type:'bar',
      data:{
        labels:labels,
        datasets:[{
          label:'該当者数',
          data:counts,
          borderRadius:6,
          borderSkipped:false,
          maxBarThickness:38,
          backgroundColor:(c)=>{
            const {ctx,chartArea}=c.chart;
            if(!chartArea) return GREEN;
            return cfg.horizontal
              ? makeGradient(ctx,chartArea,GREEN_DARK,ACCENT)
              : makeGradientV(ctx,chartArea,GREEN_DARK,GREEN_LIGHT);
          },
        }]
      },
      options:{
        indexAxis: cfg.horizontal ? 'y' : 'x',
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:400},
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor:GREEN_DARK,
            padding:10,
            callbacks:{label:(c)=>` ${c.parsed[cfg.horizontal?'x':'y']} 名`}
          }
        },
        scales:{
          x:{
            beginAtZero:true,
            grid:{color:GRID_COLOR,drawBorder:false},
            ticks:{precision:0, color:'#5c6b63', font:{size:11}}
          },
          y:{
            grid:{display:!cfg.horizontal, color:GRID_COLOR,drawBorder:false},
            ticks:{color:'#33413a', font:{size:12}}
          }
        }
      }
    });
    chartInstances.push(chart);
  });

  /* フッター */
  document.getElementById('footer').innerHTML =
    `データソース：${DATA.meta.source_file}　｜　大林組 みんまちPJ`;
}
</script>
</body>
</html>
