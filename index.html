<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんまちPJ 会員属性ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --obayashi-green:#00913A; --obayashi-green-dark:#00702D; --obayashi-green-light:#4FBB7A;
  --obayashi-accent:#8DC63F; --ink:#1b2a22; --sub:#5c6b63; --bg:#f4f7f5; --card:#ffffff; --line:#e3ebe6;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--ink);}
.header{background:linear-gradient(120deg,var(--obayashi-green-dark) 0%,var(--obayashi-green) 55%,var(--obayashi-accent) 130%);
  color:#fff;padding:30px 40px 26px;position:relative;overflow:hidden;}
.header::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:rgba(255,255,255,.08);border-radius:50%;}
.header::before{content:"";position:absolute;right:90px;bottom:-90px;width:200px;height:200px;background:rgba(255,255,255,.06);border-radius:50%;}
.header .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.header .logo{width:44px;height:44px;border-radius:10px;background:#fff;color:var(--obayashi-green);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.header h1{margin:0;font-size:25px;letter-spacing:.04em;position:relative;z-index:1;}
.header p{margin:8px 0 0;opacity:.92;font-size:14px;position:relative;z-index:1;}
.header .updated{margin:6px 0 0;font-size:12px;opacity:.8;position:relative;z-index:1;}
.tabs{position:absolute;top:24px;right:34px;z-index:2;display:flex;gap:8px;}
.tabs a{display:inline-block;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;color:#fff;border:1.5px solid rgba(255,255,255,.6);transition:.15s;}
.tabs a.active{background:#fff;color:var(--obayashi-green-dark);border-color:#fff;}
.tabs a:hover{background:rgba(255,255,255,.2);}
.tabs a.active:hover{background:#fff;}
.wrap{max-width:1200px;margin:0 auto;padding:26px 24px 60px;}
.filterbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:22px;box-shadow:0 2px 10px rgba(0,50,20,.05);}
.filter-item{display:flex;flex-direction:column;gap:6px;}
.filter-item .fl-title{font-size:12px;font-weight:700;color:var(--obayashi-green-dark);}
.filterbar select{appearance:none;-webkit-appearance:none;font-size:14px;font-weight:600;color:var(--ink);padding:9px 38px 9px 14px;border:2px solid var(--obayashi-green);border-radius:10px;min-width:190px;cursor:pointer;
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2300913A' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;}
.filterbar select:hover{border-color:var(--obayashi-green-dark);}
.actions{margin-left:auto;display:flex;gap:10px;align-items:flex-end;}
/* toggle */
.toggle{display:inline-flex;border:2px solid var(--obayashi-green);border-radius:10px;overflow:hidden;}
.toggle button{border:none;background:#fff;color:var(--obayashi-green-dark);font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer;}
.toggle button.on{background:var(--obayashi-green);color:#fff;}
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-reset{background:#eef3f0;color:var(--sub);}
.btn-reset:hover{background:#e0e8e3;}
.btn-csv{background:var(--obayashi-green);color:#fff;box-shadow:0 3px 10px rgba(0,145,58,.3);}
.btn-csv:hover{background:var(--obayashi-green-dark);}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,50,20,.04);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;height:100%;width:5px;background:var(--obayashi-green);}
.kpi .label{font-size:13px;color:var(--sub);margin-bottom:6px;}
.kpi .value{font-size:32px;font-weight:800;color:var(--obayashi-green-dark);line-height:1.1;}
.kpi .unit{font-size:14px;color:var(--sub);margin-left:4px;font-weight:600;}
.warn-banner{display:none;align-items:center;gap:10px;background:#fff4e0;border:1px solid #f3ce88;color:#8a5a12;border-radius:12px;padding:12px 18px;margin-bottom:20px;font-size:13px;}
.warn-banner .ico{font-size:16px;}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 26px;box-shadow:0 2px 12px rgba(0,50,20,.05);}
.card.col-6{grid-column:span 6;}
.card.col-12{grid-column:span 12;}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;}
.card h2 .dot{width:11px;height:11px;border-radius:3px;background:var(--obayashi-green);}
.card .sub{font-size:12px;color:var(--sub);margin:0 0 16px;}
.chart-box{position:relative;width:100%;}
.empty-note{text-align:center;color:var(--sub);font-size:14px;padding:60px 10px;background:#fafcfb;border:1px dashed var(--line);border-radius:12px;}
.footer{margin-top:34px;text-align:center;font-size:12px;color:var(--sub);}
.status{max-width:1200px;margin:20px auto;padding:18px 22px;border-radius:14px;background:#fff8e6;border:1px solid #f0d98a;color:#7a5a10;font-size:14px;line-height:1.7;}
.status code{background:#fdeecb;padding:2px 6px;border-radius:5px;}
.reload-btn{display:inline-block;margin-left:8px;padding:4px 12px;border:none;border-radius:8px;background:#fff;color:var(--obayashi-green-dark);font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);}
@media(max-width:820px){.card.col-6{grid-column:span 12;}.header{padding:26px 22px;}.tabs{position:static;margin-top:14px;}.actions{margin-left:0;width:100%;flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="header">
  <div class="tabs">
    <a href="index.html" class="active">単一ビュー</a>
    <a href="compare.html">比較モード</a>
  </div>
  <div class="brand">
    <div class="logo">大</div>
    <div><h1>みんまちPJ 会員属性ダッシュボード</h1></div>
  </div>
  <p>LINE公式アカウント登録会員のタグ集計（値が「1」= 該当）｜ プロトタイプ</p>
  <p class="updated" id="updated"></p>
</div>

<div class="wrap">
  <div class="filterbar" id="filterbar" style="display:none">
    <div id="filters" style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;"></div>
    <div class="actions">
      <div class="toggle" id="modeToggle">
        <button data-mode="count" class="on">件数</button>
        <button data-mode="percent">割合(%)</button>
      </div>
      <button class="btn btn-reset" id="resetBtn">リセット</button>
      <button class="btn btn-csv" id="csvBtn">CSV出力</button>
    </div>
  </div>

  <div class="warn-banner" id="warnBanner">
    <span class="ico">⚠</span>
    <span id="warnText"></span>
  </div>

  <div class="kpi-row" id="kpiRow"></div>
  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>
</div>

<script src="dashboard-core.js"></script>
<script>
const DATA_FILE = 'dashboard_data.json';
let DATA = null;
const state = {};
let mode = 'count';
let charts = [];

loadData(DATA_FILE)
  .then(data=>{
    DATA = data;
    buildFilters(document.getElementById('filters'), data, state, render);
    document.getElementById('filterbar').style.display = 'flex';
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      data.filters.forEach(f=>state[f.key]=ANY);
      buildFilters(document.getElementById('filters'), data, state, render);
      render();
    });
    document.getElementById('csvBtn').addEventListener('click', exportCsv);
    document.querySelectorAll('#modeToggle button').forEach(b=>{
      b.addEventListener('click', ()=>{
        mode = b.dataset.mode;
        document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on', x===b));
        render();
      });
    });
    render();
    const now = new Date();
    document.getElementById('updated').textContent =
      'データ生成：' + (data.meta.generated_at||'-') + ' ／ 最終読み込み：' + now.toLocaleString('ja-JP');
  })
  .catch(err=>{
    document.querySelector('.wrap').innerHTML =
      `<div class="status"><strong>⚠ データの読み込みに失敗しました（${err.message}）</strong>
        <button class="reload-btn" onclick="location.reload()">再読み込み</button><br><br>
        ・<code>${DATA_FILE}</code> が <code>index.html</code> と<strong>同じフォルダ</strong>にあるか<br>
        ・<code>dashboard-core.js</code> も同じフォルダにあるか<br>
        ・GitHubにアップ済みか、<strong>Ctrl+F5</strong>で強制リロードを試してください
      </div>`;
  });

function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  const members = filterMembers(DATA, state);
  const label = selectionText(DATA, state);

  /* 少数サンプル警告 */
  const warn = document.getElementById('warnBanner');
  if(isSmall(members.length)){
    warn.style.display='flex';
    document.getElementById('warnText').innerHTML =
      `対象が <b>${members.length}名</b> と少ないため、割合(%)は変動しやすい<b>参考値</b>です（1名で約${Math.round(100/members.length)}%動きます）。`;
  } else { warn.style.display='none'; }

  /* KPI */
  const male   = members.filter(m=>m.tags.includes('男性')).length;
  const female = members.filter(m=>m.tags.includes('女性')).length;
  const kpis = [
    {label:'対象会員数', value:members.length, unit:'名'},
    {label:'絞り込み条件', value:label, unit:''},
    {label:'男性 / 女性', value:`${male} / ${female}`, unit:'名'},
  ];
  document.getElementById('kpiRow').innerHTML = kpis.map(k=>`
    <div class="kpi"><div class="label">${k.label}</div>
      <div class="value">${k.value}<span class="unit">${k.unit}</span></div></div>`).join('');

  /* グラフ */
  const grid = document.getElementById('grid'); grid.innerHTML='';
  const unit = (mode==='percent') ? '割合(%)' : '該当者数';
  DATA.sections.forEach(sec=>{
    const horizontal = (LAYOUT[sec.key]||{}).horizontal;
    const col = horizontal ? 'col-12' : 'col-6';
    const card = document.createElement('div'); card.className='card '+col;
    if(members.length===0){
      card.innerHTML = `<h2><span class="dot"></span>${sec.title}</h2>
        <p class="sub">${unit}（対象 0名）</p>
        <div class="empty-note">この条件に該当する会員がいません</div>`;
      grid.appendChild(card); return;
    }
    const h = horizontal ? Math.max(220, sec.labels.length*30+60) : 300;
    card.innerHTML = `<h2><span class="dot"></span>${sec.title}</h2>
      <p class="sub">${unit}（対象 ${members.length}名中）</p>
      <div class="chart-box" style="height:${h}px"><canvas></canvas></div>`;
    grid.appendChild(card);
    charts.push(drawBar(card.querySelector('canvas'), sec, members, mode, [GREEN_DARK, ACCENT]));
  });

  document.getElementById('footer').innerHTML =
    `データソース：${DATA.meta.source_file}　｜　大林組 みんまちPJ`;
}

function exportCsv(){
  const members = filterMembers(DATA, state);
  const label = selectionText(DATA, state);
  const csv = buildCsv(DATA, members, label);
  const safe = label.replace(/[・\/\\:*?"<>|]/g,'_');
  downloadCsv(`みんまちPJ_集計_${safe}_${stamp()}.csv`, csv);
}
</script>
</body>
</html>
